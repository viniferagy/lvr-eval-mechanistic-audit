models:
  lvr_7b:
    name: "LVR-7B"
    path: "./models/LVR-7B"
    arch: "lvr_qwen2_5_vl_traced"
    lvr_source_path: "../lvr"
    layer_path: null
    image_pad_token: "<|image_pad|>"
    lvr_start_token: "<|lvr_start|>"
    lvr_token: "<|lvr|>"
    lvr_latent_end_token: "<|lvr_latent_end|>"
    lvr_end_token: "<|lvr_end|>"

audit:
  mode: "generation_trace"
  query_target: "auto"
  lvr_expansion_mode: "fixed"
  lvr_num_tokens: 16
  lvr_include_latent_end_token: false
  allow_lvr_fallback_to_answer_probe: false
  allow_synthetic_lvr_assistant: false
  allow_multiple_lvr_placeholders: false
  lvr_decoding_strategy: "steps"
  lvr_steps: 2
  max_image_side: 384
  max_image_pixels: 147456

data:
  source_type: "lvr_json"
  json_path: "./data/viscot_sroie_dude_lvr_existing_images_small.json"
  image_root: "./data/visual_cot_hf/images"
  max_samples: 3
  max_scan_records: 200
  shuffle_seed: 260523
  skip_missing_images: true
  require_lvr_placeholder: true

preregistration:
  enabled: true
  manifest_path: "prereg/manifest.yaml"

inference:
  dtype: "bfloat16"
  device: "cuda:0"

metrics:
  lvr_generation_trace:
    enabled: true

validation:
  run_sanity: true
  fail_fast: true
  v2:
    min_samples: 3
    min_pairs: 3
    max_error_ratio: 0.2
    allow_center_fallback: true

output:
  root: "./runs"
  run_name: null
