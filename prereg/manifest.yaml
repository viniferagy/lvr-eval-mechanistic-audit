manifest_version: "0.9-findings-gate"
project: "LatentFaith-Audit"
created_for: "findings_gate"
analysis_blind_seed: 260523
stopping_rule:
  description: "Run the preregistered sample budget per model/task unless failures are attributable to missing local data or model weights."
  min_samples_per_model_task: 200
  expensive_metric_subset: 50
primary_metrics:
  - metric_id: "pf_a_corruption_selectivity"
    family: "PF"
    primary_scalar: "selectivity"
    version: "0.2-w2-final-gate"
    status: "runnable_v0_validated"
  - metric_id: "pf_b_patch_alignment"
    family: "PF"
    primary_scalar: "native_alignment"
    version: "0.2-w2-final-gate"
    status: "runnable_v0_validated"
  - metric_id: "bf_patch_answer_transfer"
    family: "BF"
    primary_scalar: "continuous_margin_shift"
    legacy_scalar: "logprob_margin_shift"
    version: "0.4-main-continuous-margin"
    status: "main_shortest_path_primary"
  - metric_id: "bf_swap_latent_replacement"
    family: "BF"
    primary_scalar: "continuous_margin_shift"
    legacy_scalar: "swap_margin_shift"
    version: "0.4-main-continuous-margin"
    status: "main_shortest_path_primary"
  - metric_id: "bf_conf_calibrated_progression"
    family: "BF"
    primary_scalar: "gold_logit_slope"
    version: "0.2-w2-final-gate"
    status: "runnable_v0_validated"
  - metric_id: "cf_stage_decay"
    family: "CF"
    primary_scalar: "late_delta"
    version: "0.2-w2-final-gate"
    status: "runnable_v0_validated"
experimental_metrics:
  - metric_id: "lvr_latent_patch_answer_transfer"
    family: "BF"
    primary_scalar: "latent_answer_transfer_rate"
    version: "0.3-w3-latent-gate"
    status: "runnable_w3_gate"
    scope: "true_lvr_generation_time_hidden_feedback_intervention"
  - metric_id: "lvr_latent_patch_answer_transfer"
    family: "BF"
    primary_scalar: "best_step_transfer_rate"
    version: "0.4-w4-step-localization"
    status: "runnable_w4_stepsweep"
    scope: "true_lvr_generation_time_hidden_feedback_step_localization"
  - metric_id: "monet_latent_patch_answer_transfer"
    family: "BF"
    primary_scalar: "latent_answer_transfer_rate"
    version: "0.13-w13-monet-transformers-latent-gate"
    status: "runnable_w13_range_gate"
    scope: "Monet official Transformers latent-mode ce_patch_vec hidden-state intervention on SPD-Faith"
    boundary: "not modified-vLLM scheduler-native generation"
statistics:
  bootstrap:
    ci: 0.95
    n_resamples: 5000
    paired: true
  mixed_effects:
    formula: "metric_value ~ model + task + (1|dataset_or_sample_group)"
    implemented_fallback: "value ~ model + task"
    status: "implemented_fixed_effects_fallback_for_main_readiness"
accepted_trace_qualities:
  - "instrumented_sparse_v0"
  - "monet_vllm_latent_v0"
evidence_level_policy:
  qwen_query_span_control:
    models:
      - "qwen2_5_vl_3b"
      - "qwen2_5_vl_7b"
    evidence_type: "query-span / hidden-state control"
    boundary: "Qwen baselines have no latent visual reasoning loop; they are controls, not real-latent intervention evidence."
  lvr_generation_trace_latent:
    models:
      - "lvr_7b"
    evidence_type: "generation-time hidden-feedback trace-latent intervention"
    trace_quality: "instrumented_sparse_v0"
    accepted_trace_qualities:
      - "instrumented_sparse_v0"
      - "monet_vllm_latent_v0"
    boundary: "Applies only to configs using lvr_qwen2_5_vl_traced and trace_latent.enabled=true."
  monet_transformers_latent_range_gate:
    models:
      - "monet_7b"
    evidence_type: "official Transformers latent_mode ce_patch_vec hidden-state patch"
    trace_quality: "monet_transformers_latent_mode_v0"
    boundary: "Real-latent range gate, not modified-vLLM scheduler-native generation trace."
gates:
  - gate_id: "W5_capacity_sweep"
    metric_id: "lvr_latent_patch_answer_transfer"
    primary_scalars:
      - "best_step_transfer_rate"
      - "step_transfer_auc"
    sample_budget: 50
    lvr_steps: [2, 4, 8, 16]
    status: "completed_gate"
  - gate_id: "W6_best_step_replication"
    metric_id: "lvr_latent_patch_answer_transfer"
    primary_scalar: "latent_answer_transfer_rate"
    sample_budget: 50
    patch_step: 4
    status: "completed_gate"
  - gate_id: "W7_spd_scale_regression"
    metrics:
      - "pf_a_corruption_selectivity"
      - "pf_b_patch_alignment"
      - "bf_patch_answer_transfer"
      - "bf_swap_latent_replacement"
      - "bf_conf_calibrated_progression"
      - "cf_stage_decay"
    sample_budget: 200
    models:
      - "qwen2_5_vl_3b"
      - "qwen2_5_vl_7b"
      - "lvr_7b"
    status: "completed_regression_gate"
  - gate_id: "W8_evidence_pack"
    artifact: "docs/evidence_pack_w5_w8.md"
    status: "completed_packaging_gate"
  - gate_id: "W9_findings_spd_scale"
    metrics:
      - "pf_a_corruption_selectivity"
      - "pf_b_patch_alignment"
      - "bf_patch_answer_transfer"
      - "bf_swap_latent_replacement"
      - "bf_conf_calibrated_progression"
      - "cf_stage_decay"
    sample_budget: 500
    models:
      - "qwen2_5_vl_3b"
      - "qwen2_5_vl_7b"
      - "lvr_7b"
    status: "completed_regression_gate"
  - gate_id: "W9_findings_maze_subset"
    metrics:
      - "pf_a_corruption_selectivity"
      - "pf_b_patch_alignment"
      - "bf_conf_calibrated_progression"
      - "cf_stage_decay"
    sample_budget: 200
    models:
      - "qwen2_5_vl_3b"
      - "qwen2_5_vl_7b"
      - "lvr_7b"
    status: "completed_findings_gate"
  - gate_id: "W9_findings_evidence_pack"
    artifact: "docs/findings_evidence_pack.md"
    status: "completed_packaging_gate"
  - gate_id: "W12_monet_preflight"
    model: "monet_7b"
    public_model: "NOVAglow646/Monet-7B"
    public_data: "NOVAglow646/Monet-SFT-125K"
    adapter_arch: "monet_qwen2_5_vl"
    artifact: "docs/decisions/W12_monet_preflight.md"
    run_dir: "runs/w12_monet_preflight_n16"
    source_commit: "08939998d3d643a73a316e349faa34f420429153"
    sample_budget: 16
    metrics:
      - "pf_a_corruption_selectivity"
      - "pf_b_patch_alignment"
      - "bf_conf_calibrated_progression"
    status: "completed_preflight_not_causal_result"
    boundary: "standard-forward architecture/data preflight only; true Monet latent causal evidence requires modified-vLLM trace adapter"
  - gate_id: "W13_monet_transformers_latent_range"
    model: "monet_7b"
    public_model: "NOVAglow646/Monet-7B"
    public_data: "Jackson-Lv/SPD-Faith-Bench"
    metric_id: "monet_latent_patch_answer_transfer"
    primary_scalar: "latent_answer_transfer_rate"
    adapter_arch: "monet_qwen2_5_vl"
    config: "config.monet_latent_patch.range.yaml"
    artifact: "docs/validation_report_w13_monet.md"
    run_dir: "runs/w13_monet_latent_patch_n50"
    source_commit: "08939998d3d643a73a316e349faa34f420429153"
    sample_budget: 50
    latent_size: 10
    patch_steps: ["all"]
    status: "completed_range_gate"
    boundary: "causal hidden-state patching through Monet Transformers latent_mode; vLLM scheduler-native trace remains future work"
  - gate_id: "W14_W15_lvr_trace_latent_primary_metrics"
    model: "lvr_7b"
    public_data: "Jackson-Lv/SPD-Faith-Bench"
    adapter_arch: "lvr_qwen2_5_vl_traced"
    config: "config.lvr_trace_latent.w14_w15.yaml"
    artifact: "docs/validation_report_w14_w15_trace_latent.md"
    run_dir: "runs/w14_w15_lvr_trace_latent_n50_v2"
    sample_budget: 50
    trace_quality: "instrumented_sparse_v0"
    metrics:
      - "pf_a_corruption_selectivity"
      - "pf_b_patch_alignment"
      - "bf_patch_answer_transfer"
      - "bf_swap_latent_replacement"
      - "bf_conf_calibrated_progression"
      - "cf_stage_decay"
    primary_scalars:
      - "selectivity"
      - "native_alignment"
      - "logprob_margin_shift"
      - "swap_margin_shift"
      - "gold_logit_slope"
      - "late_delta"
    status: "completed_trace_latent_gate"
    boundary: "LVR-only generation-time hidden-feedback metric upgrade at n=50; not Monet scheduler-native trace and not full Main-scale matrix"
  - gate_id: "W16_lvr_trace_latent_scale_plan"
    model: "lvr_7b"
    public_data: "Jackson-Lv/SPD-Faith-Bench"
    adapter_arch: "lvr_qwen2_5_vl_traced"
    configs:
      - "config.lvr_trace_latent.spd_n500.yaml"
      - "config.lvr_trace_latent.spd_n1000_light.yaml"
    sample_budgets:
      all_primary_metrics: 500
      light_metrics: 1000
    status: "n500_completed_n1000_light_completed"
    completed_run_dir: "runs/w16_lvr_trace_latent_spd_n500_sharded/merged"
    completed_light_run_dir: "runs/w17_lvr_trace_latent_spd_n1000_light/merged"
    boundary: "n=500 all-six trace-latent gate is complete; n=1000 light gate is complete for PF-A/PF-B/BF-Conf/CF-Stage only, with BF-Patch/BF-Swap intentionally disabled"
  - gate_id: "W16_t1_t2_t3_main_matrix_plan"
    configs:
      - "config.main_maze_n1000.yaml"
      - "config.main_spd_n1000.yaml"
      - "config.main_blink_n1000.yaml"
      - "config.main_vsi_accuracy.yaml"
    tasks:
      - "T1 MazePlanning"
      - "T2 SPD-Faith"
      - "T3 BLINK"
      - "T4 VSI-Bench accuracy sanity"
    models:
      - "qwen2_5_vl_3b"
      - "qwen2_5_vl_7b"
      - "lvr_7b"
    status: "t1_t2_t3_matrix_complete_t4_visual_staged_pending_accuracy_run"
    t4_public_data: "nyu-visionx/VSI-Bench"
    t4_visual_source: "official scannetpp.zip converted to 50 static frame-grid JPEGs"
    t4_visual_staging:
      frame_grid_stats: "data/vsi_raw/frame_grids/frame_grid_prepare_stats.json"
      manifest: "data/vsi_bench/manifest.jsonl"
      prepared_rows: 1458
      unique_scene_grids: 50
      skipped_no_answer: 0
      frame_grid_protocol: "16-frame 4x4 static image grid"
    boundary: "T4 is output accuracy sanity only; current local T4 staging is the official VSI-Bench scannetpp visual subset, not the full three-zip VSI visual set. Models see one static 16-frame image grid rather than native video or the official 32-frame protocol, so accuracy is not directly comparable to published VSI-Bench video-LLM numbers. BLINK PF/PF-B may use weak-oracle center fallback when bbox metadata is absent"
  - gate_id: "W20_spotlight_vstar_high_resolution"
    role: "spotlight"
    public_data: "craigwu/vstar_bench"
    public_data_loader: "huggingface_hub.snapshot_download"
    public_data_note: |
      The Hugging Face parquet/Data Studio projection omits the per-image
      JSON bbox field. The preregistered V*Bench path therefore downloads the
      full dataset repository and reads direct_attributes/sa_XXXXX.json and
      relative_position/sa_XXXXX.json directly. Do not replace this with
      datasets.load_dataset("craigwu/vstar_bench").
    models:
      - "qwen2_5_vl_3b"
      - "qwen2_5_vl_7b"
      - "lvr_7b"
    config: "config.main_vstar_n191.yaml"
    sample_budget: 191
    metrics:
      - "pf_a_corruption_selectivity"
      - "pf_b_patch_alignment"
      - "bf_conf_calibrated_progression"
      - "cf_stage_decay"
    primary_scalars:
      - "selectivity"
      - "native_alignment"
      - "gold_logit_slope"
      - "late_delta"
    spotlight_hypotheses:
      H1: |
        For LVR-7B, PF-A selectivity on V*Bench is substantially larger
        than on SPD-Faith. This would support the claim that LVR's latent
        visual reasoning preferentially attends to small, well-localized
        answer regions.
      H2: |
        H1 holds for LVR-7B but not for Qwen-VL baselines. A flat or smaller
        V*Bench-vs-SPD delta on Qwen would isolate the effect to LVR's latent
        loop rather than to generic VLM scale.
    statistical_notes: |
      V*Bench-vs-SPD-Faith comparison uses independent two-sample bootstrap,
      not paired bootstrap, because the datasets are not matched sample-wise.
      n=191 makes this a qualitative spotlight gate, not a Main matrix row.
    status: "planned_W20"
    boundary: |
      V*Bench has 191 total samples; this is a small-n spotlight gate,
      not a Main matrix entry. V*Bench bbox regions can cover less than 1%
      of the image; if pilot coverage is too small, rerun with preregistered
      bbox dilation sensitivity rather than silently changing the main config.
