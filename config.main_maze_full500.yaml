models:
  qwen2_5_vl_7b:
    name: Qwen2.5-VL-7B
    path: ./models/Qwen/Qwen2___5-VL-7B-Instruct
    arch: qwen2_5_vl
    layer_path: null
    image_pad_token: <|image_pad|>
  qwen2_5_vl_3b:
    name: Qwen2.5-VL-3B
    path: ./models/Qwen/Qwen2___5-VL-3B-Instruct
    arch: qwen2_5_vl
    layer_path: null
    image_pad_token: <|image_pad|>
  lvr_7b:
    name: LVR-7B
    path: ./models/LVR-7B
    arch: lvr_qwen2_5_vl
    lvr_source_path: ../lvr
    layer_path: null
    image_pad_token: <|image_pad|>
    lvr_start_token: <|lvr_start|>
    lvr_token: <|lvr|>
    lvr_latent_end_token: <|lvr_latent_end|>
    lvr_end_token: <|lvr_end|>
audit:
  mode: standard_forward
  query_target: auto
  max_image_side: 384
  max_image_pixels: 147456
model_aliases:
  M0: qwen2_5_vl_7b
  M0_small: qwen2_5_vl_3b
  M2: lvr_7b
data:
  source_type: maze
  jsonl_path: ./data/maze_planning/manifest.jsonl
  image_root: ./data/maze_planning/images
  skip_missing_images: false
  max_samples: 500
  shuffle_seed: 260717
preregistration:
  enabled: true
  manifest_path: prereg/manifest.yaml
inference:
  dtype: bfloat16
  device: cuda:0
metrics:
  pf_a_corruption_selectivity:
    enabled: true
  pf_b_patch_alignment:
    enabled: true
  bf_patch_answer_transfer:
    enabled: false
  bf_swap_latent_replacement:
    enabled: false
  bf_conf_calibrated_progression:
    enabled: true
  cf_stage_decay:
    enabled: true
pf3:
  corruption_mode: mask_50pct
  num_seeds: 1
pf_a:
  seed: 260717
  severity: 1.0
pf_b:
  seed: 260717
  severity: 1.0
  use_dino: false
bf_conf:
  text_only_control: true
cf_stage:
  readout: pf3
  max_samples: 1000
  families:
    mask:
    - 0.4
    - 0.8
validation:
  run_sanity: true
  fail_fast: true
  bf3:
    min_layers: 20
  v2:
    min_samples: 450
    min_pairs: 0
    max_error_ratio: 0.2
    allow_center_fallback: true
output:
  root: ./runs
  run_name: null
