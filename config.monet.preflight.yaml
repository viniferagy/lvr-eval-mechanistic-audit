models:
  monet_7b:
    name: "Monet-7B"
    path: "./models/Monet-7B"
    arch: "monet_qwen2_5_vl"
    monet_source_path: "../Monet"
    layer_path: null
    image_pad_token: "<|image_pad|>"
    latent_start_token: "<abs_vis_token>"
    latent_start_id: 151666
    latent_end_id: 151667

audit:
  mode: "standard_forward"
  query_target: "auto"
  max_image_side: 384
  max_image_pixels: 147456

model_aliases:
  M3: monet_7b

data:
  source_type: "jsonl"
  jsonl_path: "./data/monet_sft/manifest.jsonl"
  image_root: "./data/monet_sft/images"
  skip_missing_images: false
  max_samples: 16
  shuffle_seed: 260615
  field_map:
    id: ["id"]
    image: ["image"]
    question: ["question"]
    answer: ["answer"]

preregistration:
  enabled: true
  manifest_path: "prereg/manifest.yaml"

inference:
  dtype: "bfloat16"
  device: "cuda:0"

metrics:
  lvr_generation_trace:
    enabled: false
  pf_a_corruption_selectivity:
    enabled: true
  pf_b_patch_alignment:
    enabled: true
  bf_conf_calibrated_progression:
    enabled: true

pf_a:
  seed: 260615
  severity: 1.0

pf_b:
  seed: 260615
  severity: 1.0
  use_dino: false

bf_conf:
  text_only_control: true

validation:
  run_sanity: true
  fail_fast: true
  v2:
    min_samples: 16
    min_pairs: 0
    max_error_ratio: 0.2
    allow_center_fallback: true

output:
  root: "./runs"
  run_name: null
